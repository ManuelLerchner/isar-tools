[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "isar-tools"
version = "0.0.0"
description = "Source tooling for Isabelle/Isar projects: formatting, checks, and statistics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manuel Lerchner" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["isabelle", "isar", "formatter", "theorem-proving"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ManuelLerchner/isar-tools"
Repository = "https://github.com/ManuelLerchner/isar-tools"
Issues = "https://github.com/ManuelLerchner/isar-tools/issues"

[project.scripts]
isar = "isar_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isar_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
pythonpath = ["."]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["isar_tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "PTH"]
# Isabelle symbols are the subject matter: Unicode look-alikes are intended.
ignore = ["RUF001", "RUF002", "RUF003", "UP040"]
