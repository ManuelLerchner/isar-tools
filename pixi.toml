[workspace]
name = "isar-tools"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11"
hatchling = ">=1.25"
pytest = "*"
pytest-cov = "*"
hypothesis = "*"

[pypi-dependencies]
isar-tools = { path = ".", editable = true }

[tasks]
test = { cmd = "pytest", description = "Run the test suite." }
coverage = { cmd = "pytest --cov --cov-report=term-missing --cov-fail-under=100", description = "Run the test suite and require full line and branch coverage." }
isar = { cmd = "isar", description = "Run the isar CLI from the working tree." }
corpus = { cmd = "pytest tests/corpus", description = "Run the corpus integration tests over the projects listed in ISAR_CORPUS." }

[feature.build.dependencies]
python-build = "*"
twine = ">=6"

[feature.build.tasks]
build-wheel = { cmd = "python -m build --no-isolation .", description = "Build the PyPI wheel and source distribution." }
check-wheel = { cmd = "twine check dist/*", description = "Validate built Python distributions." }

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
pyright = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"

[feature.lint.tasks]
pre-commit-install = { cmd = "lefthook install", description = "Install the git hooks." }
lint = { cmd = "lefthook run pre-commit --all-files --force", description = "Run every linter and formatter check over the repository." }
typecheck = { cmd = "pyright", description = "Type-check sources and tests in strict mode." }

[feature.py311.dependencies]
python = "3.11.*"

# Records the README demo GIF with VHS: `pixi run demo`.
[feature.demo.dependencies]
# vhs 0.12.0 records frames but never writes the output file (fixed in 0.12.1).
vhs = "!=0.12.0"
ttyd = "*"
ffmpeg = "*"

[feature.demo.tasks]
demo = { cmd = "vhs docs/demo/demo.tape", description = "Record docs/demo/demo.gif from docs/demo/demo.tape." }

[environments]
default = ["lint", "build"]
py311 = ["py311"]
demo = { features = ["demo"], solve-group = "default" }
